name: Build LiquidCloud
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish GlassPlayer/GlassPlayer.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o LiquidCloud
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidCloud-win-x64
          path: LiquidCloud
